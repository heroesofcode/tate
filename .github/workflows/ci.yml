name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: processor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          working-directory: ${{ github.workspace }}/processor
      - name: Lint
        run: |
          uv run --frozen ruff check
          uv run --frozen ruff format --check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: processor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          working-directory: ${{ github.workspace }}/processor
      - name: Typecheck
        run: uv run --frozen mypy src

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: processor
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          working-directory: ${{ github.workspace }}/processor
      - name: Test
        run: uv run --frozen pytest

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: processor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          working-directory: ${{ github.workspace }}/processor
      - name: Build the wheel and process a synthetic chapter
        run: |
          set -euo pipefail
          uv build --out-dir "$RUNNER_TEMP/dist"
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/dist"/*.whl
          "$RUNNER_TEMP/venv/bin/tate" --help
          OUT="$RUNNER_TEMP" "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          from PIL import Image, ImageDraw

          root = Path(os.environ["OUT"])
          image = Image.new("RGB", (640, 880), "white")
          draw = ImageDraw.Draw(image)
          panels = (
              (30, 30, 290, 400, (210, 210, 210)),
              (330, 30, 600, 400, (190, 190, 190)),
              (30, 450, 290, 840, (170, 170, 170)),
              (330, 450, 600, 840, (150, 150, 150)),
          )
          for left, top, right, bottom, fill in panels:
              draw.rectangle((left, top, right, bottom), fill=fill, outline=(0, 0, 0), width=8)
          page = root / "page.jpg"
          image.save(page, format="JPEG", quality=90)
          with zipfile.ZipFile(root / "sample.cbz", "w") as archive:
              archive.write(page, "page.jpg")
          PY
          "$RUNNER_TEMP/venv/bin/tate" process "$RUNNER_TEMP/sample.cbz" \
            -o "$RUNNER_TEMP/sample.tate" \
            --detector cv \
            --quiet
          test -s "$RUNNER_TEMP/sample.tate"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          working-directory: ${{ github.workspace }}/processor
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build a synthetic chapter
        working-directory: processor
        run: uv run --frozen python scripts/pipeline_chapter.py "${{ github.workspace }}/pipeline-out"
      - name: Install reader dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build the reader
        working-directory: web
        run: pnpm build
      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the pipeline spec
        working-directory: web
        env:
          TATE_E2E_PACKAGE: ${{ github.workspace }}/pipeline-out/chapter-cv.tate
        run: pnpm exec playwright test e2e/pipeline.spec.ts
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - name: Upload the produced package
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-tate
          path: |
            pipeline-out/chapter-cv.tate
            pipeline-out/chapter-page.tate
          if-no-files-found: ignore

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: processor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          working-directory: ${{ github.workspace }}/processor
      - name: Audit locked requirements
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt"
