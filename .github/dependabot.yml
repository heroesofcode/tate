version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /processor
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
